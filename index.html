<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourdough Tracker PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sourdough Progress Tracker</h1>
        <p>Welcome to your sourdough baking companion.</p>
        <div id="app">
            <div class="input-section">
                <label for="grams">Enter grams:</label>
                <input type="number" id="grams" placeholder="e.g., 100">
                <button id="add-btn">Add</button>
                <button id="subtract-btn">Subtract</button>
                <button id="clear-btn">Clear History</button>
            </div>
            <div id="total-display">
                <p>Total grams: <span id="total">0</span>g</p>
            </div>
            <div id="entries">
                <h2>Addition History</h2>
                <ul id="entries-list"></ul>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
